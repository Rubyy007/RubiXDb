# cargo-deny policy for rubiXDb (single-node local product).
# `cargo deny --workspace --all-features check` must pass for a release.
[graph]
all-features = true

[licenses]
# Permissive licences only. Copyleft (GPL/AGPL/LGPL/MPL-as-sole-option) is NOT
# allowed: a crate offered under `X OR LGPL` is accepted through X.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are `publish = false` and carry no licence field.
ignore = true

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
