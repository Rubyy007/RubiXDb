[package]
name = "rubixdb-instance"
version = "0.1.0"
edition = "2021"
description = "RubiXDB local instance manager -- discovery, OS-level ownership locking, and lifecycle for the single-user local product model"
publish = false

[dependencies]
fs4 = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }

# SG-2: owner+SYSTEM-only DACL on credentials.json (src/winacl.rs). 0.61.2 is
# already in Cargo.lock (tokio and others), so this adds no new crate source.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
