[workspace]
members = [".", "api", "sql", "cli", "instance"]

[package]
name = "rubixdb"
version = "0.1.0"
edition = "2021"
description = "RubixDB — embedded, multi-engine database (Phase 0: LSM engine)"
publish = false

[features]
test-util = []
# F-11: named pause points on the startup / recovery path (`src/startup_probe.rs`), driven by environment variables. Off
# in every product build; the interruption tests of `cli/tests/f11_startup_interruption_integration.rs` turn it on.
startup-probe = []
# D1a (ADR-FAULTPOINTS-01): the test-only fault-point registry (`src/faults.rs`): named persistence boundaries, env-driven
# rules, execution log. Off in every product build and NEVER listed as a dependency feature by any workspace member
# (tests/fault_points_absent_from_product.rs enforces that); only the root package's tests and examples turn it on.
fault-points = []
# D1b (ADR-PERSISTENCE-TRAIT-01): the power-loss simulator behind `src/persist` (`SimFs`). Off in every product build and never
# listed by any workspace member as a dependency feature (tests/fault_points_absent_from_product.rs enforces both); only the
# root package's tests and examples turn it on. Without it `src/persist` is a straight forward to `std::fs`.
sim-fs = []
bench = []
# TEMPORARY, experiment-only — see PHASE1_ADR.md (window-size sweep ADR)
# and PHASE1_TEST_RESULTS.md's window-size sweep section. Not enabled by
# default, not depended on by any other feature. Gates a runtime,
# env-var-driven override of GroupCommitter's leader batch-window
# formula, used only to answer "does throughput scale with window size on
# this machine" empirically. Reduces to the exact production formula when
# its env vars are unset, and is fully removable (this feature plus its
# one gated module in src/wal/group_commit.rs) without touching any
# production code path.
phase1-window-experiment = []
# TEMPORARY, experiment-only — see FINAL_WAL_TEST.md's spin-wait A/B
# section and PHASE1_ADR.md. Not enabled by default, not depended on by
# any other feature. Gates a runtime, env-var-driven override of the
# leader's batch-window wait *mechanism* (spin/yield vs. sleep-based vs.
# hybrid) — orthogonal to `phase1-window-experiment`, which controls the
# window's *duration*, not how the wait is implemented. Reduces to the
# exact production spin/yield behavior when its env var is unset, and is
# fully removable (this feature plus its one gated branch in
# `src/wal/group_commit.rs`) without touching any production code path.
phase1-waitmode-experiment = []

[dependencies]
crc32c = "=0.6.8"
xxhash-rust = { version = "=0.8.18", features = ["xxh64"] }

[dev-dependencies]
proptest = "=1.11.0"
criterion = "=0.8.2"
static_assertions = "=1.1.0"

[[bench]]
name = "wal_bench"
harness = false

[[bench]]
name = "append"
harness = false
required-features = ["bench"]

[[bench]]
name = "write_batch_bench"
harness = false

[[bench]]
name = "table_store_bench"
harness = false

[[bench]]
name = "secondary_index_bench"
harness = false

[[bench]]
name = "transaction_bench"
harness = false

# D1a (ADR-FAULTPOINTS-01): the kill-9 rig. Both need the registry, so neither exists in a default build.
[[example]]
name = "fault_child"
required-features = ["fault-points"]

[[test]]
name = "fault_points"
path = "tests/fault_points/main.rs"
required-features = ["fault-points"]

# D1a decision gate (docs/D1a_DECISION_GATE.md): regression tests for F-D1a-1 and F-D0-1/2/3/5. They fail on the code as it
# stands by design and pass when the corresponding PROPOSED ADR is implemented.
[[test]]
name = "pending_fixes"
required-features = ["fault-points"]

# D1b (docs/PERSISTENCE_MODEL.md §6): the four proof tests that gate every class-C claim, plus M7/M8 and an engine-on-SimFs run.
[[test]]
name = "sim_proof"
required-features = ["sim-fs"]

# D1b crash-injection cycle (smoke set; the D1c matrix reuses it). Spawns examples/fault_child, which must be built with the same
# features: `cargo build --features fault-points,sim-fs --example fault_child`.
[[test]]
name = "sim_power_loss"
path = "tests/sim_power_loss/main.rs"
required-features = ["fault-points", "sim-fs"]
