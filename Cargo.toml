[package]
name = "rubixdb"
version = "0.1.0"
edition = "2021"
description = "RubixDB — embedded, multi-engine database (Phase 0: LSM engine)"
publish = false

[features]
test-util = []
bench = []
# TEMPORARY, experiment-only — see PHASE1_ADR.md (window-size sweep ADR)
# and PHASE1_TEST_RESULTS.md's window-size sweep section. Not enabled by
# default, not depended on by any other feature. Gates a runtime,
# env-var-driven override of GroupCommitter's leader batch-window
# formula, used only to answer "does throughput scale with window size on
# this machine" empirically. Reduces to the exact production formula when
# its env vars are unset, and is fully removable (this feature plus its
# one gated module in src/wal/group_commit.rs) without touching any
# production code path.
phase1-window-experiment = []
# TEMPORARY, experiment-only — see FINAL_WAL_TEST.md's spin-wait A/B
# section and PHASE1_ADR.md. Not enabled by default, not depended on by
# any other feature. Gates a runtime, env-var-driven override of the
# leader's batch-window wait *mechanism* (spin/yield vs. sleep-based vs.
# hybrid) — orthogonal to `phase1-window-experiment`, which controls the
# window's *duration*, not how the wait is implemented. Reduces to the
# exact production spin/yield behavior when its env var is unset, and is
# fully removable (this feature plus its one gated branch in
# `src/wal/group_commit.rs`) without touching any production code path.
phase1-waitmode-experiment = []

[dependencies]
crc32c = "=0.6.8"

[dev-dependencies]
proptest = "=1.11.0"
criterion = "=0.8.2"
static_assertions = "=1.1.0"

[[bench]]
name = "wal_bench"
harness = false

[[bench]]
name = "append"
harness = false
required-features = ["bench"]
