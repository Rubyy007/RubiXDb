[package]
name = "rubixdb-api"
version = "0.1.0"
edition = "2021"
description = "RubiXDB product API — HTTP service layer above the certified LSM engine"
publish = false

[dependencies]
rubixdb = { path = ".." }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
rubixdb = { path = "..", features = ["test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
