[package]
name = "rubixdb-api"
version = "0.1.0"
edition = "2021"
description = "RubiXDB product API — HTTP service layer above the certified LSM engine"
publish = false

[dependencies]
rubixdb = { path = ".." }
rubixdb-sql = { path = "../sql" }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "timeout"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
# Already in Cargo.lock (tower-http, hyper-util, tokio); used by the response-header layer.
pin-project-lite = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
rubixdb = { path = "..", features = ["test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Increment 14, Blocker 8 (heap/ownership memory analysis) --
# `heaptrack`/`valgrind`/`massif` do not exist on Windows; `dhat` is
# the standard Rust-native equivalent (a real, source-attributed heap
# profiler, not a correlational RSS guess), used only by the
# `heap_ownership_profile` example below, never linked into any
# production binary.
dhat = "0.3"
 