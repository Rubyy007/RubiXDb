[package]
name = "rubixdb-sql"
version = "0.1.0"
edition = "2021"
description = "RubiXDB SQL layer — parser, internal AST, binder (no execution)"
publish = false

[dependencies]
rubixdb = { path = ".." }
sqlparser = "=0.63.0"

[dev-dependencies]
proptest = "=1.11.0"
criterion = "=0.8.2"

[features]
# Forwards to `rubixdb`'s own `test-util` feature -- `sql/tests/write_
# crash_consistency.rs`'s only reason to exist, mirroring the root
# crate's own `cargo test --features test-util` convention exactly
# (`tests/crash_consistency.rs`, `tests/group_commit/crash_consistency.rs`).
test-util = ["rubixdb/test-util"]

[[bench]]
name = "sql_parser_bench"
harness = false

[[bench]]
name = "sql_binder_bench"
harness = false

[[bench]]
name = "query_planner_bench"
harness = false

[[bench]]
name = "query_executor_bench"
harness = false

[[bench]]
name = "write_executor_bench"
harness = false
