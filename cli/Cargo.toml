[package]
name = "rubixdb-cli"
version = "0.1.0"
edition = "2021"
description = "RubiXDB CLI -- a thin HTTP client of POST /v1/sql, never a second SQL engine"
publish = false

[[bin]]
name = "rubixdb"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rustyline = "14"
rpassword = "7"
# Only the `gui` subcommand (`src/gui.rs`) and instance-discovery in
# `main.rs` use these -- the client role (`src/client.rs` and
# everything it drives) remains a pure HTTP client of `POST /v1/sql`,
# per `PHASE_RELATIONAL_CLI_ARCHITECTURE.md` §1: it never calls into
# `rubixdb`/`rubixdb-sql` to execute SQL locally. The `gui` role's job
# is exactly to host the one real server (reusing its library code
# directly, never a second implementation) -- see
# `PHASE_RUBIXDB_GUI_ARCHITECTURE.md` §1 for the distinction.
rubixdb = { path = ".." }
rubixdb-api = { path = "../api" }
rubixdb-instance = { path = "../instance" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }

[dev-dependencies]
axum = "0.7"
